<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SpendWise</title></head>
  <body>
    <main>
      <h1>SpendWise</h1>
      <p>Decide 90% of claims within 2 working days; stop using spreadsheets for claims within 1 month; let an employee submit a claim in under 2 minutes.</p>
      <form id="expense-form">
        <label>Amount <input name="amount" type="number" min="0.01" step="0.01" required></label>
        <label>Date <input name="date" type="date" required></label>
        <label>Category <input name="category" required></label>
        <button type="submit">Add expense</button>
      </form>
      <output id="message" aria-live="polite"></output>
      <pre id="summary"></pre>
    </main>
    <script>
      const form = document.querySelector('#expense-form');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const data = Object.fromEntries(new FormData(form));
        const response = await fetch('/expenses', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ...data, amount: Number(data.amount) }) });
        const result = await response.json();
        document.querySelector('#message').textContent = result.error ?? 'Expense saved.';
        const month = String(data.date).slice(0, 7);
        document.querySelector('#summary').textContent = JSON.stringify(await (await fetch('/summary?month=' + month)).json(), null, 2);
      });
    </script>
  </body>
</html>
